[package]
name = "hearth-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hearth resident daemon: unix-socket server bundling the shared engine and tools"

[[bin]]
name = "hearthd"
path = "src/main.rs"

[dependencies]
hearth-core = { workspace = true }
hearth-tools = { workspace = true }
hearth-proto = { workspace = true }

serde = { workspace = true }
rmp-serde = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
mimalloc = { workspace = true }

[features]
default = []
profiling = ["hearth-core/profiling"]
