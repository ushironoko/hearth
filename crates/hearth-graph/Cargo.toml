[package]
name = "hearth-graph"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone tree-sitter symbol index and module graph with injectable languages"
documentation = "https://docs.rs/hearth-graph"
readme = "README.md"
keywords = ["code-intelligence", "tree-sitter", "symbols", "dependency-graph"]
categories = ["development-tools", "parser-implementations"]

[features]
default = ["bundled-languages", "fs", "resolve-js", "resolve-rust"]
bundled-languages = [
  "dep:tree-sitter-rust",
  "dep:tree-sitter-typescript",
  "dep:tree-sitter-javascript",
  "dep:tree-sitter-go",
  "dep:tree-sitter-python",
  "dep:tree-sitter-ruby",
  "dep:tree-sitter-c",
  "dep:tree-sitter-cpp",
  "dep:tree-sitter-java",
  "dep:tree-sitter-c-sharp",
  "dep:tree-sitter-zig",
  "dep:tree-sitter-bash",
  "dep:tree-sitter-haskell",
  "dep:tree-sitter-lua",
  "dep:tree-sitter-php",
  "dep:tree-sitter-swift",
  "dep:tree-sitter-md",
]
fs = []
resolve-js = [
  "dep:oxc_resolver",
  "dep:serde_json",
  "dep:json-strip-comments",
]
resolve-rust = []

[dependencies]
tree-sitter.workspace = true
compact_str.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
parking_lot.workspace = true
xxhash-rust.workspace = true

tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-zig = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-haskell = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }
oxc_resolver = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
json-strip-comments = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
