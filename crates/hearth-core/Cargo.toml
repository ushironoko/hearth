[package]
name = "hearth-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hearth orchestration core: resident engine, shared caches, profiler, worker pools"

[dependencies]
hearth-proto = { workspace = true }

# perf primitives
compact_str = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
xxhash-rust = { workspace = true }
memchr = { workspace = true }
bumpalo = { workspace = true }

# concurrency
parking_lot = { workspace = true }
dashmap = { workspace = true }
crossbeam-channel = { workspace = true }
num_cpus = { workspace = true }
once_cell = { workspace = true }

# fs
memmap2 = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }

serde = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }

[features]
default = []
# When enabled, the ProfilingAllocator counts every allocation. The leaf binary
# composes it as the #[global_allocator]; core only provides the type.
profiling = []

[dev-dependencies]
tempfile = { workspace = true }
