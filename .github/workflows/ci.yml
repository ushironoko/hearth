name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: every job opts in to exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A pull request must not be able to poison a cache that `main` later restores,
  # so only pushes to the default branch write one.
  RUST_CACHE_SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  security:
    name: dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Audit locked JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit locked Rust dependencies
        run: cargo audit --file Cargo.lock --deny warnings

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test release version validator
        run: node --test scripts/verify-napi-release-versions.test.mjs

      # Static analysis of these workflows themselves: template injection,
      # credential persistence, unpinned actions, over-broad permissions.
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # Fail the job on findings rather than uploading SARIF, which would
          # need `security-events: write`.
          advanced-security: false

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml, so the pinned version and its
      # components install themselves on first use.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo clippy --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ env.RUST_CACHE_SAVE }}

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint hearth-graph without default features
        run: cargo clippy -p hearth-graph --no-default-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  hearth-graph-windows:
    name: hearth-graph (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: rustc --version && cargo --version && cargo clippy --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ env.RUST_CACHE_SAVE }}

      - name: Test hearth-graph default features
        run: cargo test -p hearth-graph --all-targets

      - name: Lint focused resolve-js build
        run: cargo clippy -p hearth-graph --no-default-features --features resolve-js --lib -- -D warnings

      - name: Test focused resolve-js build
        run: cargo test -p hearth-graph --no-default-features --features resolve-js --lib

  napi:
    name: napi (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ env.RUST_CACHE_SAVE }}

      # pnpm first: setup-node's `cache: pnpm` needs the binary on PATH. The
      # version comes from the root package.json's `packageManager` field.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build addon
        run: pnpm run build:napi:debug

      # The loader and .d.ts are committed, so a change to the Rust surface that
      # was not regenerated must fail here rather than surprise a consumer.
      - name: Generated bindings are up to date
        run: git diff --exit-code -- crates/hearth-napi/index.js crates/hearth-napi/index.d.ts

      - name: Contract suite and smoke (node)
        run: |
          node crates/hearth-napi/__test__/contract.mjs
          node crates/hearth-napi/smoke.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Contract suite and smoke (bun)
        run: |
          bun crates/hearth-napi/__test__/contract.mjs
          bun crates/hearth-napi/smoke.mjs

  tarball:
    name: packed tarball (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ env.RUST_CACHE_SAVE }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build addon (release)
        run: pnpm run build:napi

      # Installs what would actually be published into a directory that shares
      # nothing with the workspace, and exports HEARTH_ENTRY pointing at it.
      - name: Pack and install into a clean directory
        run: bash scripts/verify-tarball.sh

      - name: Run the suites against the installed package
        run: |
          node crates/hearth-napi/smoke.mjs
          node crates/hearth-napi/__test__/contract.mjs
          bun crates/hearth-napi/smoke.mjs
          bun crates/hearth-napi/__test__/contract.mjs
