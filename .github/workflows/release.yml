name: Release @hearthdev/napi

# Tag-driven. `napi version` writes the version into every platform package, so
# the tag is the single source of truth for what gets published.
on:
  push:
    tags:
      - "napi-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not publish"
        type: boolean
        default: true
      diagnose_oidc:
        description: "Only probe the npm OIDC token exchange, skipping the build"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # npm below this cannot do trusted publishing; the publish job refuses to run
  # on an older one rather than silently falling back to some other auth path.
  MIN_NPM_VERSION: 11.5.1

jobs:
  # Asks the registry, per package, whether it will exchange this workflow's
  # OIDC token for a publish token — and prints the reason when it will not.
  #
  # `npm publish` cannot answer that question: `oidc()` logs the registry's
  # refusal at verbose level, returns undefined, and lets publishing fall
  # through to a plain ENEEDAUTH, which says nothing about why. This probe runs
  # the same exchange with logging turned up, and publishes nothing.
  #
  # It has to live in this file: npm matches the token's claims against a
  # configured workflow *filename*, so a probe in any other workflow would fail
  # for a reason the real publish never hits.
  diagnose-oidc:
    name: probe the OIDC token exchange
    if: ${{ inputs.diagnose_oidc }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same environment as the publish job, so the `environment` claim the
    # registry sees is the one a real publish would present.
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Probe each package
        run: |
          set -uo pipefail
          status=0
          for pkg in @hearthdev/napi @hearthdev/napi-darwin-arm64 @hearthdev/napi-darwin-x64 \
                     @hearthdev/napi-linux-x64-gnu @hearthdev/napi-linux-arm64-gnu; do
            dir="$(mktemp -d)"
            # The exchange is keyed on the package name alone, so a stub
            # manifest is enough — no build artifacts, no real version.
            PKG="$pkg" DIR="$dir" node -e '
              require("fs").writeFileSync(process.env.DIR + "/package.json", JSON.stringify({
                name: process.env.PKG,
                version: "0.0.0-probe",
                publishConfig: { registry: "https://registry.npmjs.org/", access: "public" },
              }))
            '
            echo "::group::$pkg"
            # --dry-run uploads nothing but still runs the exchange, which
            # happens before the credentials check. --tag keeps the stub
            # version from tripping the prerelease and version-ordering rules,
            # which would abort ahead of it. Neither the id token nor an
            # exchanged token is ever printed at this log level.
            out="$(cd "$dir" && npm publish --dry-run --access public --tag probe --loglevel verbose 2>&1)"
            echo "$out" | grep -E "oidc|need auth|Publishing to" || echo "$out" | tail -20
            echo "$out" | grep -q "Successfully retrieved and set token" || status=1
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            echo "at least one package would not authenticate — see the groups above" >&2
          fi
          exit "$status"

  build:
    name: build ${{ matrix.target }}
    if: ${{ !inputs.diagnose_oidc }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every declared target: no cross toolchain, and
          # the binary is exercised on the platform it ships to.
          - target: aarch64-apple-darwin
            runner: macos-14
          # macos-13 was retired in December 2025; macos-15-intel is the
          # free-tier x86_64 macOS image that replaced it. Apple has dropped
          # x86_64, so GitHub removes this architecture entirely when the
          # macOS 15 image retires in autumn 2027 — at which point this target
          # has to go, or move to a cross-compile.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # An older glibc than the newest runner's, so the artifact keeps
          # working on distributions that have not caught up.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # No caching anywhere in this workflow. A cache is written by other
      # workflows on other refs, so restoring one here would let a branch build
      # influence the bytes that get published — the cache-poisoning path. A
      # release is rare enough that a cold build is the cheaper side of that
      # trade.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # napi build embeds the root package version in index.js. Apply the tag
      # before generation so its strict platform-package check expects the
      # version that this run will publish.
      - name: Set the generated loader version from the tag
        if: startsWith(github.ref, 'refs/tags/napi-v')
        run: |
          version="${GITHUB_REF_NAME#napi-v}"
          npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
        working-directory: crates/hearth-napi

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm exec napi build --platform --release --esm --target "$TARGET"
        working-directory: crates/hearth-napi

      - name: Smoke the fresh binary
        # Every target here is native, so the runner can execute what it built.
        run: node crates/hearth-napi/smoke.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          # Every target independently generates the target-neutral loader and
          # declarations. Verify requires all copies to be byte-identical.
          path: |
            crates/hearth-napi/hearth.*.node
            crates/hearth-napi/index.js
            crates/hearth-napi/index.d.ts
          if-no-files-found: error
          retention-days: 7

  verify:
    name: assemble and verify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: crates/hearth-napi/artifacts

      - name: Set the published version from the tag
        # napi-v1.2.3 → 1.2.3, applied to the root package and every platform one.
        if: startsWith(github.ref, 'refs/tags/napi-v')
        run: |
          version="${GITHUB_REF_NAME#napi-v}"
          npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
          pnpm exec napi version
        working-directory: crates/hearth-napi

      - name: Stage identical generated bindings from every target
        run: |
          node scripts/verify-napi-release-versions.mjs --stage-build-bindings \
            crates/hearth-napi crates/hearth-napi/artifacts

      - name: Collect artifacts into platform packages
        run: pnpm exec napi artifacts --output-dir artifacts
        working-directory: crates/hearth-napi

      - name: Link the platform packages into the root package
        # Writes the `optionalDependencies` that let npm install only the
        # binary matching the consumer's platform. `--skip-optional-publish`
        # leaves the publishing to the gated job below.
        run: pnpm exec napi pre-publish -t npm --skip-optional-publish
        working-directory: crates/hearth-napi

      - name: Every declared target has a binary
        run: bash scripts/verify-release-artifacts.sh

      - name: Root, loader, and platform versions agree
        run: node scripts/verify-napi-release-versions.mjs

      # `napi artifacts` also copies every collected addon into the root. The
      # published root intentionally contains none, so remove those assembly
      # copies before testing the package topology that will actually ship.
      - name: Remove root-local assembly copies
        run: rm -f crates/hearth-napi/hearth.*.node

      # Exercise the topology consumers receive: a root package with no addon
      # of its own loading the separately packed Linux x64 optional package.
      - name: Verify the packed tarball on Node and Bun
        env:
          HEARTH_PLATFORM_PACKAGE_DIR: crates/hearth-napi/npm/linux-x64-gnu
          NAPI_RS_ENFORCE_VERSION_CHECK: 1
        run: |
          bash scripts/verify-tarball.sh
          node crates/hearth-napi/smoke.mjs
          node crates/hearth-napi/__test__/contract.mjs
          bun crates/hearth-napi/smoke.mjs
          bun crates/hearth-napi/__test__/contract.mjs

      # Hand the *verified* tree to the publish job rather than rebuilding it,
      # so what gets published is exactly what was tested.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tree
          path: |
            crates/hearth-napi/package.json
            crates/hearth-napi/index.js
            crates/hearth-napi/index.d.ts
            crates/hearth-napi/README.md
            crates/hearth-napi/npm/
          if-no-files-found: error
          retention-days: 7

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          {
            echo "Dry run: artifacts verified, nothing published."
            echo '```'
            (cd crates/hearth-napi && npm pack --dry-run) 2>&1 | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish to npm
    needs: verify
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A GitHub environment lets a human gate the one job that can publish, and
    # scopes the OIDC subject npm matches against.
    environment: npm-publish
    permissions:
      contents: read # download the verified tree
      id-token: write # mint the short-lived OIDC token npm trusted publishing uses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately no `registry-url`: it makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a scratch
      # .npmrc. Trusted publishing has no token to fill that in, but npm still
      # reads the line as "this registry is already authenticated", skips the
      # OIDC exchange, and publishes anonymously — which the registry answers
      # with 404 on the PUT, not 401. The registry to publish to comes from
      # each package's own `publishConfig` instead.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Node's bundled npm rather than a fresh `npm install -g`: the binary then
      # arrives inside the Node tarball setup-node already verified, instead of
      # being one more unpinned fetch on the path to a publish. Assert it is new
      # enough rather than assuming.
      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          oldest="$(printf '%s\n%s\n' "$MIN_NPM_VERSION" "$actual" | sort -V | head -1)"
          if [ "$oldest" != "$MIN_NPM_VERSION" ]; then
            echo "npm $actual is older than $MIN_NPM_VERSION, which trusted publishing requires" >&2
            exit 1
          fi
          echo "npm $actual (>= $MIN_NPM_VERSION)"

      # The two preconditions npm needs to actually take the OIDC path. Neither
      # produces a useful error on its own: a configured token makes npm skip
      # the exchange and publish anonymously, and a missing OIDC endpoint makes
      # it do the same — both surfacing as a 404 partway through the publish
      # loop, after earlier packages are already public. Check them first.
      - name: Check the publish path is tokenless
        run: |
          set -euo pipefail
          # Ask whether the key is configured, not what it holds: `npm config
          # get` refuses to return auth values at all. `npm config list` prints
          # a configured token as `(protected)`, and omits the line entirely
          # when none is set.
          if npm config list 2>/dev/null | grep -q ':_authToken'; then
            echo "a registry auth token is configured, so npm will skip the OIDC exchange:" >&2
            npm config list 2>/dev/null | grep ':_authToken' >&2
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "no OIDC token endpoint in the environment — is 'id-token: write' still set?" >&2
            exit 1
          fi
          echo "no registry token configured, OIDC token endpoint present"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tree
          path: crates/hearth-napi

      - name: Re-check the assembled packages
        run: |
          bash scripts/verify-release-artifacts.sh
          node scripts/verify-napi-release-versions.mjs

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC trusted publishing, and
      # generates provenance attestations automatically for it — `--provenance`
      # is neither needed nor passed.
      - name: Publish platform packages
        id: platforms
        run: |
          set -euo pipefail
          names=()
          for dir in npm/*/; do
            # `./` is load-bearing: npm reads a bare `a/b` as the GitHub
            # shorthand `owner/repo` and tries to clone it. The glob's trailing
            # slash happens to avoid that today, but this path runs once, during
            # a publish, after other packages are already public — not a place
            # to depend on a side effect of how the loop is written.
            npm publish "./$dir" --access public
            names+=("$(node -p "require('./${dir}package.json').name")")
          done
          echo "names=${names[*]}" >> "$GITHUB_OUTPUT"
        working-directory: crates/hearth-napi

      # npm's publish endpoint returns before the new version is visible on
      # every replica. The root package's optionalDependencies name these, so
      # publishing it into that window ships a release that installs only
      # sometimes — and npm skips an unresolvable optional dependency silently,
      # so it surfaces later as a missing addon rather than a failed install.
      - name: Wait for the platform packages to be resolvable
        env:
          PLATFORM_PACKAGES: ${{ steps.platforms.outputs.names }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./crates/hearth-napi/package.json').version")"
          # shellcheck disable=SC2086 # the names are npm package names, no spaces
          bash scripts/await-npm-availability.sh "$version" $PLATFORM_PACKAGES

      - name: Publish the root package
        run: npm publish --access public
        working-directory: crates/hearth-napi

  github-release:
    name: github release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/napi-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release for this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `gh` is preinstalled on the runner, so this needs no third-party action
      # on the one job that holds `contents: write`.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
